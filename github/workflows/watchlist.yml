name: Watchlist Refresh

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron is best-effort, not exact --
    # during high load (esp. top of the hour) this can fire a few minutes
    # late. Fine for a 15m check interval, just don't expect second-precision.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the job can commit the updated watchlist.json back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run watchlist refresh
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python refresh_watchlist.py

      - name: Commit updated watchlist (if changed)
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet smc_watchlist.json 2>/dev/null; then
            git add smc_watchlist.json
            git commit -m "Auto-refresh watchlist [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

