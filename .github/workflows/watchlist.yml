name: Watchlist Refresh

on:
  schedule:
    # Every 15 minutes, offset 7 min from Full Market Scan's schedule
    # (:07/:22/:37/:52 vs full-scan's :00/:15/:30/:45) so the two jobs
    # rarely start at the same moment and fight over the same file.
    - cron: "7-59/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the job can commit the updated watchlist.json back

concurrency:
  group: watchlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run watchlist refresh
