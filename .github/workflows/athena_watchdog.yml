name: ATHENA Scan Watchdog

on:
  schedule:
    # Runs between the primary ATHENA schedule slots. If GitHub drops a
    # primary scheduled event, this watchdog can recover it via workflow_dispatch.
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: athena-scan-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check ATHENA scan freshness and recover if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RUNS="$(gh run list \
            --repo "$GH_REPO" \
            --workflow full_scan.yml \
            --branch main \
            --limit 20 \
            --json status,conclusion,createdAt,updatedAt,number,event,databaseId)"

          export ATHENA_RUNS="$RUNS"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          runs = json.loads(os.environ["ATHENA_RUNS"])
          active_states = {"queued", "in_progress", "requested", "waiting", "pending"}

          active = [r for r in runs if r.get("status") in active_states]
          if active:
              newest = max(active, key=lambda r: r.get("createdAt") or "")
              print(
                  f"ATHENA already has an active run: #{newest.get('number')} "
                  f"({newest.get('status')}); no recovery dispatch needed."
              )
              raise SystemExit(0)

          successful = [
              r for r in runs
              if r.get("status") == "completed" and r.get("conclusion") == "success"
          ]

          if not successful:
              print("No successful ATHENA run found in recent history; dispatching recovery scan.")
              subprocess.run(
                  ["gh", "workflow", "run", "full_scan.yml", "--repo", os.environ["GH_REPO"], "--ref", "main"],
                  check=True,
              )
              raise SystemExit(0)

          latest = max(
              successful,
              key=lambda r: r.get("updatedAt") or r.get("createdAt") or "",
          )
          stamp = latest.get("updatedAt") or latest.get("createdAt")
          completed_at = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          age_minutes = (datetime.now(timezone.utc) - completed_at).total_seconds() / 60.0

          print(
              f"Latest successful ATHENA run: #{latest.get('number')}; "
              f"age={age_minutes:.1f} minutes."
          )

          if age_minutes >= 20.0:
              print("ATHENA scan is stale; dispatching recovery scan.")
              subprocess.run(
                  ["gh", "workflow", "run", "full_scan.yml", "--repo", os.environ["GH_REPO"], "--ref", "main"],
                  check=True,
              )
          else:
              print("ATHENA scan is fresh; no recovery dispatch needed.")
          PY
