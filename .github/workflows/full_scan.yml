name: ATHENA Full Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: full-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: Run ATHENA full scan
        env:
          # Enable exchange-first Position Registry integration.
          USE_POSITION_REGISTRY: "1"

          # Existing ATHENA / SMC secret names.
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}

          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CRYPTORANK_API_KEY: ${{ secrets.CRYPTORANK_API_KEY }}

        run: |
          python full_scan.py

      - name: Persist scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            watchlist.json \
            position_registry.json \
            scanner_state.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist ATHENA scanner state [skip ci]"
            git push
          fi
