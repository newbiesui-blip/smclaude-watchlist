name: ATHENA Full Market Scan

on:
  workflow_dispatch:
  repository_dispatch:
    types: [athena_tick]
  schedule:
    # GitHub schedule remains as a fallback, offset from quarter-hour boundaries.
    # Scheduler heartbeat: keep this workflow definition active.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: full-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: Run ATHENA full scan
        env:
          USE_POSITION_REGISTRY: "1"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CRYPTORANK_API_KEY: ${{ secrets.CRYPTORANK_API_KEY }}
        run: |
          # Install the central Telegram boundary before full_scan starts.
          # smc_scanner.py itself remains untouched.
          python -c "import athena_notification_state; import athena_quality_layer; raise SystemExit(athena_quality_layer.main())"

      - name: Persist ATHENA runtime state
        if: always()
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Persist the AUTHORITATIVE files actually used by production code.
          # Do not replace these with obsolete names such as watchlist.json
          # or scanner_state.json.
          git add \
            smc_watchlist.json \
            smc_setup_states.json \
            position_registry.json \
            notification_state.json \
            derivatives_history.json \
            derivatives_state.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No ATHENA runtime state changes to commit."
            exit 0
          fi

          git commit -m "chore: persist ATHENA runtime state [skip ci]"

          # The scan can take several minutes. During that time another
          # repository writer may advance main, making a plain `git push`
          # fail with a non-fast-forward error. Rebase our small runtime-state
          # commit onto the newest main and retry instead of force-pushing.
          for attempt in 1 2 3; do
            echo "Synchronizing runtime-state commit with origin/main (attempt ${attempt}/3)..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Runtime-state rebase conflicted; aborting without force-push."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "ATHENA runtime state persisted successfully."
              exit 0
            fi

            echo "Push raced with another writer; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to persist ATHENA runtime state after 3 synchronized push attempts."
          exit 1
