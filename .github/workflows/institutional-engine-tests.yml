name: Institutional Engine Tests

on:
  push:
    branches: ["institutional-entry-engine"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests pytest
      - run: pytest -q test_athena_institutional_engine.py
